name: tmp-floor-diag
on:
  push:
    branches: [fix/floor-openblas]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::remotes, any::devtools
      - name: Profile gate, threads and repeats
        run: |
          for t in default default 1 1; do
            if [ "$t" = "1" ]; then export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1; fi
            echo "=== threads=$t ==="
            Rscript tests/sim/sem-nonlinear-profile-gate.R 2>&1 | grep -E "^NOTE|NONLINEAR PROFILE" || true
          done
          nproc
