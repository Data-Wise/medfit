name: tmp-floor-diag
on:
  push:
    branches: [fix/floor-openblas]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::remotes, any::devtools
      - name: Profile gate with diagnostics
        run: Rscript tests/sim/sem-nonlinear-profile-gate.R 2>&1 | tail -60 || true
