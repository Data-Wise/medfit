# Simulation gates (tests/sim/run-gates.R) as a mechanical release check (0.11.0 plan R2, grill G2 and G6).
# Runs the full --sim set and the driver's own --mutants self-test on Linux for PRs to main and on request.
# Rollout (G6): NOT a required status check yet. Two consecutive green runs on Linux were recorded before merge
# (2026-10-17/18, both shards, about 23 minutes each); make `gates (reliability)` and `gates (rest)` required on main
# when the author decides. The gate runs strict on the runner's reference BLAS (the #238 floor fixture is fixed).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_only:
        description: "Also run the local-only gates (tests/sim/gates-local-only.txt, each over 5 min hosted; twolevel-equal-size alone is 28 to 53 min)"
        type: boolean
        default: false

name: gates

permissions: read-all

# A new push to a PR cancels that PR's superseded run; manual dispatches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reliability-shard:
    # The reliability gate (76,800 fits) in SHARDS parallel jobs. The grid has 1,200 independent rows (structure x n x
    # rep); shard i runs rows i, i + SHARDS, ... on all four cores (tests/sim/sem-reliability.R, SHARD and SHARDS). The
    # unsharded job took 19 to 23 minutes on three of the four cores. Not a required check by name: the required
    # `gates (reliability)` is the aggregator job below.
    name: gates reliability shard ${{ matrix.shard }}
    # Pinned to ubuntu-24.04: the full gates job timed out at 75 min on ubuntu-26.04 (PR #307 runs 40053057744 attempts
    # 1-2, 40053008246, 40051687109) and passed on 24.04 for the same tree (run 40109489583: reliability 22 min, rest
    # 28 min). A single gate run alone on 26.04 was fast (run 40059864450), so the cause is not yet known.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      SHARDS: "6" # must equal the matrix size; scripts/merge-reliability.R fails when the shard files do not match it
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Suggests included: the native gates compare against lavaan and OpenMx and a missing one is a failed gate
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::remotes, any::devtools

      - name: Run this shard of the reliability grid
        run: SHARD=${{ matrix.shard }} Rscript tests/sim/sem-reliability.R

      - name: Upload the shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-results-reliability-${{ matrix.shard }}
          path: tests/sim/results/shards/sem-reliability-*.csv.gz
          if-no-files-found: error

  reliability:
    # The required status check `gates (reliability)` (branch protection on main names it; do not rename). Passes only
    # when every shard succeeded, the shard files merge into one results file (all SHARDS of one date), and the gate's
    # own verdict (tests/sim/run-gates.R, unchanged: 76,800 rows, match rate, no worker errors) passes on the merged file.
    # `if: always()` so a cancelled or skipped shard fails this check instead of leaving it skipped.
    name: gates (reliability)
    needs: reliability-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every shard succeeded
        env:
          SHARD_RESULT: ${{ needs.reliability-shard.result }}
        run: |
          echo "shard jobs: $SHARD_RESULT"
          [ "$SHARD_RESULT" = "success" ] || { echo "::error::a reliability shard did not succeed ($SHARD_RESULT)"; exit 1; }

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: actions/download-artifact@v8
        with:
          pattern: gate-results-reliability-*
          path: reliability-shards
          merge-multiple: true

      - name: Merge the shards and run the gate verdict
        run: |
          Rscript scripts/merge-reliability.R reliability-shards 6
          # --max-age 2: the merged file is from today; an older file in the tree cannot satisfy the verdict
          Rscript tests/sim/run-gates.R --only reliability --max-age 2

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-results-reliability
          path: |
            tests/sim/results/gates-*.log
            tests/sim/results/gates-summary-*.txt
          if-no-files-found: warn

  shard:
    # Every other gate, in SHARDS parallel shards chosen by measured time (scripts/gate-shards.R, weights in
    # tests/sim/gate-seconds.csv). The unsharded `rest` job took 58 to 97 minutes (77.5 on the v0.21.1 release PR, run
    # 45777601031); one gate, twolevel-equal-size, is about 31 minutes of that and cannot be split across jobs, so the
    # bound is that gate. A gate added to tests/sim/gates.csv lands in a shard automatically. Not a required check by
    # name: the required `gates (rest)` is the aggregator job below. The local-only gates (tests/sim/gates-local-only.txt,
    # twolevel-equal-size among them) are not in the partition unless a manual dispatch sets `local_only`.
    name: gates rest shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      SHARDS: "3" # must equal the matrix size; the aggregator's union check fails when it does not
      # empty on PRs; "--local-only" only for a manual dispatch that asked for the local-only gates
      LOCAL_ONLY: ${{ inputs.local_only && '--local-only' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::remotes, any::devtools

      # Once per workflow run, in a light shard (not the one holding twolevel-equal-size)
      - name: Driver self-test (mutants)
        if: matrix.shard == 2
        run: Rscript tests/sim/run-gates.R --mutants

      - name: Run the gates of this shard (--sim)
        run: |
          only=$(Rscript scripts/gate-shards.R select ${{ matrix.shard }} "$SHARDS" $LOCAL_ONLY)
          echo "gates: $only"
          mkdir -p tests/sim/results
          echo "$only" > tests/sim/results/shard-gates-${{ matrix.shard }}.txt
          Rscript tests/sim/run-gates.R --sim --only "$only" $LOCAL_ONLY

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-results-rest-${{ matrix.shard }}
          path: |
            tests/sim/results/gates-*.log
            tests/sim/results/gates-summary-*.txt
            tests/sim/results/shard-gates-*.txt
          if-no-files-found: warn

  rest:
    # The required status check `gates (rest)` (branch protection on main names it; do not rename). Passes only when
    # every shard succeeded and the shards together ran exactly the gates of tests/sim/gates.csv minus reliability.
    # `if: always()` so a cancelled or skipped shard fails this check instead of leaving it skipped (a skipped required
    # check counts as passing).
    name: gates (rest)
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every shard succeeded
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          echo "shard jobs: $SHARD_RESULT"
          [ "$SHARD_RESULT" = "success" ] || { echo "::error::a gates shard did not succeed ($SHARD_RESULT)"; exit 1; }

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: actions/download-artifact@v8
        with:
          pattern: gate-results-rest-*
          path: shard-artifacts

      - name: Shards together run exactly the rest set
        env:
          LOCAL_ONLY: ${{ inputs.local_only && '--local-only' || '' }}
        run: |
          Rscript scripts/gate-shards.R union-check shard-artifacts $LOCAL_ONLY
          Rscript scripts/test-gate-shards.R
