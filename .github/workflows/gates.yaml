# Simulation gates (tests/sim/run-gates.R) as a mechanical release check (0.11.0 plan R2, grill G2 and G6).
# Runs the full --sim set and the driver's own --mutants self-test on Linux for PRs to main and on request.
# Rollout (G6): NOT a required status check at first; make it required (branch protection on main) only after two
# consecutive green runs on Linux, because the gate tolerances were calibrated on macOS (SLSQP output differs
# from Linux at about 1e-9). TRIAL trigger: pushes to feature/gates-ci also run it; remove that trigger when this
# workflow is merged.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [feature/gates-ci]

name: gates

permissions: read-all

jobs:
  gates:
    # Two shards run in parallel: the reliability gate (76,800 fits) alone, and every other gate. A gate added to
    # tests/sim/gates.csv lands in "rest" automatically.
    name: gates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [reliability, rest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      # issue #238: one extreme-scale fixture is platform-sensitive on the runner's reference BLAS; report-only here,
      # strict locally. Remove this line when #238 is fixed.
      MEDFIT_FLOOR_REPORT_ONLY: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Suggests included: the native gates compare against lavaan and OpenMx and a missing one is a failed gate
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::remotes, any::devtools

      - name: Driver self-test (mutants)
        if: matrix.shard == 'rest'
        run: Rscript tests/sim/run-gates.R --mutants

      - name: Run the gates of this shard (--sim)
        run: |
          if [ "${{ matrix.shard }}" = "reliability" ]; then
            only="reliability"
          else
            only=$(Rscript -e 'ids <- read.csv("tests/sim/gates.csv", stringsAsFactors = FALSE)$gate; cat(setdiff(ids, "reliability"), sep = ",")')
          fi
          echo "gates: $only"
          Rscript tests/sim/run-gates.R --sim --only "$only"

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-${{ matrix.shard }}
          path: |
            tests/sim/results/gates-*.log
            tests/sim/results/gates-summary-*.txt
          if-no-files-found: warn
