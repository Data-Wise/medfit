# Simulation gates (tests/sim/run-gates.R) as a mechanical release check (0.11.0 plan R2, grill G2 and G6).
# Runs the full --sim set and the driver's own --mutants self-test on Linux for PRs to main and on request.
# Rollout (G6): NOT a required status check yet. Two consecutive green runs on Linux were recorded before merge
# (2026-10-17/18, both shards, about 23 minutes each); make `gates (reliability)` and `gates (rest)` required on main
# when the author decides. The gate runs strict on the runner's reference BLAS (the #238 floor fixture is fixed).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

name: gates

permissions: read-all

jobs:
  gates:
    # Two shards run in parallel: the reliability gate (76,800 fits) alone, and every other gate. A gate added to
    # tests/sim/gates.csv lands in "rest" automatically.
    name: gates (${{ matrix.shard }})
    # Pinned to ubuntu-24.04: the full gates job timed out at 75 min on ubuntu-26.04 (PR #307 runs 40053057744 attempts
    # 1-2, 40053008246, 40051687109) and passed on 24.04 for the same tree (run 40109489583: reliability 22 min, rest
    # 28 min). A single gate run alone on 26.04 was fast (run 40059864450), so the cause is not yet known.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [reliability, rest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Suggests included: the native gates compare against lavaan and OpenMx and a missing one is a failed gate
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::remotes, any::devtools

      - name: Driver self-test (mutants)
        if: matrix.shard == 'rest'
        run: Rscript tests/sim/run-gates.R --mutants

      - name: Run the gates of this shard (--sim)
        run: |
          if [ "${{ matrix.shard }}" = "reliability" ]; then
            only="reliability"
          else
            only=$(Rscript -e 'ids <- read.csv("tests/sim/gates.csv", stringsAsFactors = FALSE)$gate; cat(setdiff(ids, "reliability"), sep = ",")')
          fi
          echo "gates: $only"
          Rscript tests/sim/run-gates.R --sim --only "$only"

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-results-${{ matrix.shard }}
          path: |
            tests/sim/results/gates-*.log
            tests/sim/results/gates-summary-*.txt
          if-no-files-found: warn
