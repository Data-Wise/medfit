# Risk tier (QC plan Q-2 and review R-1, planning/specs/BRAINSTORM-optimizer-quality-control-2026-10-23.md).
# A PR that changes a file the optimizer sees (tests/sim/risk-files.txt) must carry the seven-check admission
# checklist in its body, each item ticked or "n/a: <reason>". A test cannot see a diff, so a job does. Release PRs
# from `dev` are exempt. Rollout: NOT a required check yet; make `risk-tier` required after three clean PRs.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

name: risk-tier

permissions: read-all

jobs:
  risk-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Check the admission checklist
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          Rscript tests/sim/risk-tier.R "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/body.txt" "$HEAD_REF"
