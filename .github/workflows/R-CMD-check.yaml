name: R-CMD-check
run-name: medfit #546 union-only backport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backport:
    name: ${{ matrix.os }} (R release, S7 1.0.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Verify and unpack the CRAN source
        shell: bash
        run: |
          mkdir probe
          curl -fsSL https://cran.r-project.org/src/contrib/medfit_0.3.2.tar.gz -o probe/original.tar.gz ||
            curl -fsSL https://cran.r-project.org/src/contrib/Archive/medfit/medfit_0.3.2.tar.gz -o probe/original.tar.gz
          echo 'ec7c7a1e1ee2bfba8aba83a5391197fa906dfa7cfc477180a5f32c2d2c0ed9ad  probe/original.tar.gz' | sha256sum -c
          tar -xzf probe/original.tar.gz -C probe
          git show HEAD:tools/medfit-546/s4-unions.patch | git apply --directory=probe/medfit -

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: probe/medfit
          extra-packages: cran::S7@1.0.0
          cache: false

      - name: Check S7 and reproduce the original failure
        shell: bash
        run: |
          Rscript --vanilla -e 'cat(R.version.string, R.Version()[["platform"]], "\n"); stopifnot(packageVersion("S7") == "1.0.0"); cat("S7 ", as.character(packageVersion("S7")), "\n")'
          mkdir probe/original-lib
          if R CMD INSTALL --library=probe/original-lib probe/original.tar.gz > probe/original-install.log 2>&1; then
            cat probe/original-install.log
            echo 'Unpatched source unexpectedly installed'
            exit 1
          fi
          cat probe/original-install.log
          grep -F 'Class union has not been registered with S4' probe/original-install.log

      - name: Install and load the patched source
        shell: bash
        run: |
          mkdir probe/patched-lib
          R CMD INSTALL --library=probe/patched-lib probe/medfit 2>&1 | tee probe/patched-install.log
          Rscript --vanilla tools/medfit-546/check-namespace.R probe/patched-lib 2>&1 | tee probe/namespace.log

      - name: Build and run the packaged tests
        working-directory: probe
        shell: bash
        run: |
          R CMD build --no-build-vignettes medfit 2>&1 | tee build.log
          R CMD check --no-manual --ignore-vignettes medfit_0.3.2.tar.gz 2>&1 | tee check.log

      - name: Print test results
        if: always()
        shell: bash
        run: |
          for log in probe/medfit.Rcheck/tests/testthat.Rout*; do
            if [ -f "$log" ]; then tail -n 30 "$log"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medfit-546-${{ matrix.os }}-logs
          path: |
            probe/*.log
            probe/medfit.Rcheck/00check.log
            probe/medfit.Rcheck/00install.out
            probe/medfit.Rcheck/tests/testthat.Rout*
