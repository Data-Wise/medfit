# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Runs on main only (release PRs and pushes). Work on dev is gated locally by
# scripts/check-local.sh; main's required check `ubuntu-latest (release)` comes from here.
# workflow_dispatch runs the full matrix on any ref when wanted.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A new push to a PR cancels that PR's superseded run (as lint and test-coverage do); pushes to main and manual
# dispatches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    # `runner` pins the image where set. The job name still comes from `os`, because main's required check is named
    # `ubuntu-latest (release)`; renaming it would leave that check unreported and block release PRs.
    runs-on: ${{ matrix.config.runner || matrix.config.os }}
    # Bound a stalled runner (e.g. a throttled apt mirror) instead of the 360-minute default. The 0.17.0 suite
    # runs about 22 minutes on a laptop (FIML files are 71% of it) and 30 minutes on the macOS runner; 45 cancelled
    # the Linux and Windows jobs on the 0.17.0 release PR. The 0.20.0 suite (244 test files, the native two-level
    # tests) took 95 minutes on Ubuntu release, 147 on Windows and 157 on oldrel-1, and cancelled devel and macOS at
    # 180 minutes (probe runs of 2026-11-24), so the limit is 300 (the hosted maximum is 360).
    timeout-minutes: 300

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Pinned to 24.04 for a stable image (gates.yaml timed out on 26.04 in PR #307). Speed is NOT the reason: two
          # paired probe runs on one commit found no consistent difference (run 45505691085: 50 min on 24.04 against 65
          # on ubuntu-latest; run 45573883028, four jobs started together: control 24.04 46 min against control latest
          # 42 min), and one configuration varied from 42 to 62 min between runs. Capping BLAS and OpenMP threads at 1
          # made it slower (68 to 69 min, same run).
          - {os: ubuntu-latest,  runner: ubuntu-24.04, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  runner: ubuntu-24.04, r: 'release'}
          - {os: ubuntu-latest,  runner: ubuntu-24.04, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CODOC_S4_METHODS_: false

    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran", "--no-codoc")'
          error-on: '"error"'

  # noSuggests: emulate CRAN's "noSuggests" check flavor. Installs only hard
  # dependencies (Depends/Imports/LinkingTo) and runs check with
  # _R_CHECK_DEPENDS_ONLY_=true, so any Suggests package used without a
  # requireNamespace() guard fails here. Plain --as-cran misses this because it
  # installs Suggests. (Caught the unguarded MASS use in the parametric
  # bootstrap; see rforge docs/specs/PROPOSAL-cran-incoming-hardening.)
  noSuggests:
    runs-on: ubuntu-24.04
    # Bound a stalled runner (e.g. a throttled apt mirror) instead of the 360-minute default. The 0.17.0 run took
    # 20 minutes (8 before the FIML expansion).
    timeout-minutes: 45

    name: ubuntu-latest (release, noSuggests)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_DEPENDS_ONLY_: true
      _R_CHECK_CODOC_S4_METHODS_: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # testthat is a Suggests dep (deliberately, so production code can't use it
          # unguarded) but the test harness itself needs it to run tests/testthat.R.
          # dependencies: "hard" excludes Suggests for every package it resolves,
          # including extra-packages, so it must be listed explicitly here or install
          # is left to chance (transitive pulls from RSPM binary snapshots / stale
          # cache), which is what caused the intermittent "no package called
          # 'testthat'" failures.
          extra-packages: any::rcmdcheck, any::testthat

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran", "--no-codoc")'
          error-on: '"error"'
