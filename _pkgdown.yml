reference:
  - title: "Quick Start"
    desc: "Short entry points for rapid analysis"
    contents:
      - med
      - quick

  - title: "Data"
    desc: "Simulated example data"
    contents:
      - mediation_demo

  - title: "Effect Extractors"
    desc: "Extract mediation effects from fitted models"
    contents:
      - nie
      - nde
      - te
      - pm
      - paths
      - decompose
      - joint_effects

  - title: "S7 Classes"
    desc: "Core S7 class definitions for mediation data structures"
    contents:
      - MediationData
      - SerialMediationData
      - ParallelMediationData
      - InteractionMediationData
      - JointMediationData
      - ClusterMediationData
      - TwoLevelMediationData
      - TwoLevelParallelMediationData
      - BootstrapResult
      - SEMFit

  - title: "Model Fitting"
    desc: "Functions for fitting and extracting mediation models"
    contents:
      - extract_mediation
      - fit_mediation
      - fit_sem
      - mbco_sem
      - sem_control
      - compare_lr
      - medfit-syntax
      - bootstrap_mediation
      - twolevel_statistic
      - twolevel_equal_indirect

  - title: "Methods"
    desc: "tidy() and glance() for medfit classes; print, summary, anova, confint and logLik methods for SEMFit"
    contents:
      - tidy_s7_object
      - SEMFit-methods
      - starts_with("print")

