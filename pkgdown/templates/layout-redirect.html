<html>
  <head>
    <!-- Local override of pkgdown's BS5 layout-redirect.html: the script carries the #fragment to the new page
         (a meta refresh alone drops it); the meta refresh and the link are the fallback without JavaScript. -->
    <script>window.location.replace("{{{url}}}" + window.location.hash);</script>
    <meta http-equiv="refresh" content="0;URL={{{url}}}" />
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{{url}}}">
  </head>
  <body>
    <p>This page has moved to <a href="{{{url}}}">{{{url}}}</a>.</p>
  </body>
</html>
